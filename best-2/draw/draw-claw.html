<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickMe｜畫畫沒靈感夾娃娃機</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 10px;
    min-height: 100vh;
    background-color: #ffeef2;
    background-image:
        radial-gradient(circle at 12px 12px, rgba(255,255,255,.9) 0 2px, transparent 2.8px),
        radial-gradient(circle at 42px 38px, rgba(244,181,201,.45) 0 2px, transparent 3px),
        linear-gradient(135deg, #fff4f7, #ffeaf1 48%, #fff1f5);
    background-size: 120px 120px, 150px 150px, auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Microsoft JhengHei", sans-serif;
    user-select: none;
}

#game-machine {
    position: relative;
    width: 100%;
    max-width: 470px;
    background: white;
    border: 4px solid #ffccd5;
    border-radius: 24px;
    padding: 18px 14px;
    box-shadow: 0 12px 28px rgba(255,182,193,.4);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.canvas-container {
    width: 100%;
    border: 5px solid #ffccd5;
    border-radius: 16px;
    overflow: hidden;
    background: #fff0f3;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

.result {
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    padding: 12px 8px;
    border-radius: 12px;
    background: #fff0f5;
    color: #d94e79;
    font-weight: bold;
    font-size: 16px;
    line-height: 1.55;
    white-space: pre-line;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.control-panel {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 15px;
    width: 100%;
    margin-top: 15px;
}

.joystick-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.joystick {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle, #ffe7ef, #f3b3cc);
    border: 4px solid #ffb5cb;
    box-shadow: inset 0 3px 9px #c77c9c55;
    touch-action: none;
    cursor: grab;
}

.stick {
    position: absolute;
    width: 42px;
    height: 42px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: linear-gradient(145deg, white, #e9a3c1);
    border: 2px solid #d77fa5;
    box-shadow: 0 3px 6px #a75b7c66;
    pointer-events: none;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn {
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,.1);
}

.btn:active {
    transform: scale(.95);
}

.btn-drop {
    background: #ff4d6d;
}

.btn-reset {
    background: #b99bd8;
}
</style>
</head>

<body>

<div id="game-machine">
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="520"></canvas>
    </div>
    <div class="result" id="result">抓娃娃來決定畫什麼吧！</div>
    <div class="control-panel">
        <div class="joystick-area">
            <div class="joystick" id="joystick">
                <div class="stick" id="stick"></div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn btn-drop" id="btnDrop">🔴 下爪抓取</button>
            <button class="btn btn-reset" id="btnReset">重新開始</button>
        </div>
    </div>
</div>

    </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const resultBox = document.getElementById("result");
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");

    // =====================================
    // 一、隱藏的娃娃屬性
    // =====================================

    const species = [
        "狗", "貓", "兔子", "人", "狐狸",
        "鳥", "蛇", "羊", "馬", "獅子"
    ];

    const colors = [
        "紅色", "橙色", "黃色", "綠色", "藍色",
        "紫色", "棕色", "黑色", "白色", "灰色"
    ];

    const accessories = [
        "翅膀", "角", "獠牙", "利爪", "鱗片",
        "觸手", "星形瞳孔", "魔力", "尾巴", "星雲皮毛"
    ];

    const TOY_COUNT = 45;

    const PLAY_AREA = {
        minX: 90,
        maxX: 385,
        minY: 245,
        maxY: 500
    };

    // =====================================
    // 二、遊戲狀態
    // =====================================

    const STATE_IDLE = "IDLE";
    const STATE_DROPPING = "DROPPING";
    const STATE_GRABBING = "GRABBING";
    const STATE_RISING = "RISING";
    const STATE_RETURNING = "RETURNING";
    const STATE_DELIVERING = "DELIVERING";

    let gameState = STATE_IDLE;

    let score = 0;
    let toys = [];
    let heldToy = null;
    let keys = {};

    let combinationDeck = [];
    let combinationIndex = 0;

    let joystickX = 0;
    let joystickY = 0;
    let joystickActive = false;

    const claw = {
        x: 220,
        y: 220,
        dropOffset: 0,
        maxDrop: 110,
        speedX: 4,
        speedY: 3,
        heldToy: null
    };

    // =====================================
    // 三、娃娃外觀
    // 外觀與隱藏屬性完全獨立
    // =====================================

    const characterStyles = [

        // 天使
        {
            type: "angel",
            body: "#fff4d9",
            shade: "#f5c9d8",
            wing: "#ffffff",
            accent: "#f3c66b",
            cheek: "#f3a6b7"
        },

        {
            type: "angel",
            body: "#e8e5ff",
            shade: "#c9c2f0",
            wing: "#fffaff",
            accent: "#b39be8",
            cheek: "#e9a8c5"
        },

        {
            type: "angel",
            body: "#dff5ef",
            shade: "#a9d9cf",
            wing: "#f8fffd",
            accent: "#e9bd68",
            cheek: "#e9a8b7"
        },

        {
            type: "angel",
            body: "#f7e4ee",
            shade: "#e8bfd5",
            wing: "#fff8fc",
            accent: "#d9a8c6",
            cheek: "#ed9db7"
        },

        // 小惡魔
        {
            type: "devil",
            body: "#ffc4ce",
            shade: "#ed829b",
            wing: "#c85b79",
            accent: "#9c405f",
            cheek: "#e87991"
        },

        {
            type: "devil",
            body: "#d9c4f4",
            shade: "#a78bd3",
            wing: "#aa8bcf",
            accent: "#7656a8",
            cheek: "#d98da9"
        },

        {
            type: "devil",
            body: "#f6d0b5",
            shade: "#e9a17e",
            wing: "#d77f75",
            accent: "#a95058",
            cheek: "#e88e8e"
        },

        {
            type: "devil",
            body: "#c9d9f5",
            shade: "#91a9d7",
            wing: "#8398c9",
            accent: "#596fa8",
            cheek: "#d98eaa"
        }
    ];

    // =====================================
    // 四、隨機打亂陣列
    // =====================================

    function shuffle(array) {

        const arr = [...array];

        for (let i = arr.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [arr[i], arr[j]] = [arr[j], arr[i]];
        }

        return arr;
    }

    // =====================================
    // 五、娃娃類別
    // =====================================

    class Toy {

        constructor(x, y, combination) {

            this.x = x;
            this.y = y;

            this.radius = 13;

            // 真正的隱藏組合
            this.combination = combination;

            // 外觀款式獨立隨機
            // 不讀取物種、顏色、配件
            this.visualStyle =
                characterStyles[
                    Math.floor(Math.random() * characterStyles.length)
                ];

            this.visualFlip = Math.random() < 0.5 ? -1 : 1;
        }

        draw() {

            const s = this.visualStyle;

            ctx.save();

            ctx.translate(this.x, this.y);
            ctx.scale(this.visualFlip, 1);

            // 地面陰影
            ctx.fillStyle = "rgba(91, 65, 92, 0.16)";

            ctx.beginPath();
            ctx.ellipse(0, 13, 13, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // =================================
            // 翅膀
            // =================================

            ctx.fillStyle = s.wing;
            ctx.strokeStyle = s.shade;
            ctx.lineWidth = 1.2;

            // 左翅膀
            ctx.beginPath();

            ctx.moveTo(-7, 0);
            ctx.quadraticCurveTo(-19, -12, -17, -3);
            ctx.quadraticCurveTo(-17, 3, -9, 7);
            ctx.quadraticCurveTo(-15, 10, -11, 11);
            ctx.quadraticCurveTo(-7, 10, -6, 6);

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 右翅膀
            ctx.beginPath();

            ctx.moveTo(7, 0);
            ctx.quadraticCurveTo(19, -12, 17, -3);
            ctx.quadraticCurveTo(17, 3, 9, 7);
            ctx.quadraticCurveTo(15, 10, 11, 11);
            ctx.quadraticCurveTo(7, 10, 6, 6);

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // =================================
            // 小惡魔尾巴
            // =================================

            if (s.type === "devil") {

                ctx.strokeStyle = s.accent;
                ctx.lineWidth = 2.5;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(8, 8);
                ctx.quadraticCurveTo(18, 13, 15, 5);
                ctx.stroke();

                ctx.fillStyle = s.accent;

                ctx.beginPath();
                ctx.moveTo(14, 5);
                ctx.lineTo(19, 2);
                ctx.lineTo(18, 8);
                ctx.closePath();
                ctx.fill();
            }

            // =================================
            // 身體
            // =================================

            ctx.fillStyle = s.body;
            ctx.strokeStyle = s.shade;
            ctx.lineWidth = 1.5;

            ctx.beginPath();

            ctx.moveTo(-10, -4);
            ctx.quadraticCurveTo(-13, -15, -5, -15);
            ctx.quadraticCurveTo(0, -19, 5, -15);
            ctx.quadraticCurveTo(13, -15, 10, -4);
            ctx.quadraticCurveTo(15, 3, 9, 10);
            ctx.quadraticCurveTo(5, 15, 0, 14);
            ctx.quadraticCurveTo(-8, 15, -11, 8);
            ctx.quadraticCurveTo(-15, 1, -10, -4);

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // =================================
            // 頭頂特徵
            // 天使：光環
            // 惡魔：雙角
            // =================================

            if (s.type === "angel") {

                ctx.strokeStyle = s.accent;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.ellipse(0, -18, 6, 2.3, -0.08, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "rgba(255,255,255,.65)";

                ctx.beginPath();
                ctx.arc(-2, -18, 1, 0, Math.PI * 2);
                ctx.fill();

            } else {

                ctx.fillStyle = s.accent;
                ctx.strokeStyle = s.shade;
                ctx.lineWidth = 1;

                ctx.beginPath();

                ctx.moveTo(-7, -12);
                ctx.quadraticCurveTo(-12, -23, -3, -17);
                ctx.closePath();

                ctx.moveTo(7, -12);
                ctx.quadraticCurveTo(12, -23, 3, -17);
                ctx.closePath();

                ctx.fill();
                ctx.stroke();
            }

            // =================================
            // 臉部
            // =================================

            ctx.fillStyle = "#59475f";

            ctx.beginPath();

            ctx.arc(-4, -3, 1.35, 0, Math.PI * 2);
            ctx.arc(4, -3, 1.35, 0, Math.PI * 2);

            ctx.fill();

            // 腮紅
            ctx.fillStyle = s.cheek;
            ctx.globalAlpha = 0.75;

            ctx.beginPath();

            ctx.ellipse(-7, 1, 2.1, 1.2, 0, 0, Math.PI * 2);
            ctx.ellipse(7, 1, 2.1, 1.2, 0, 0, Math.PI * 2);

            ctx.fill();

            ctx.globalAlpha = 1;

            // 嘴巴
            ctx.strokeStyle = "#76566b";
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.arc(0, 0, 2, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // 所有娃娃共通的星星裝飾
            ctx.fillStyle = s.accent;
            ctx.font = "bold 7px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("✦", 0, 8);

            ctx.restore();
        }
    }

    // =====================================
    // 六、建立 1,000 種不重複組合
    // =====================================

    function createCombinationDeck() {

        const allCombinations = [];

        for (const sp of species) {

            for (const color of colors) {

                for (const accessory of accessories) {

                    allCombinations.push({
                        species: sp,
                        color: color,
                        accessory: accessory
                    });
                }
            }
        }

        combinationDeck = shuffle(allCombinations);

        combinationIndex = 0;
    }

    function getNextCombination() {

        if (combinationIndex >= combinationDeck.length) {
            return null;
        }

        return combinationDeck[combinationIndex++];
    }

    // =====================================
    // 七、隨機娃娃位置
    // =====================================

    function generateToyPositions(count, existing = []) {

        const positions = [];

        let minDistance = 27;
        let attempts = 0;

        while (positions.length < count && attempts < 30000) {

            attempts++;

            const candidate = {

                x: PLAY_AREA.minX +
                    Math.random() * (PLAY_AREA.maxX - PLAY_AREA.minX),

                y: PLAY_AREA.minY +
                    Math.random() * (PLAY_AREA.maxY - PLAY_AREA.minY)
            };

            const occupied = [...existing, ...positions];

            if (
                occupied.every(point =>
                    Math.hypot(
                        point.x - candidate.x,
                        point.y - candidate.y
                    ) >= minDistance
                )
            ) {

                positions.push(candidate);
            }

            if (attempts % 5000 === 0) {

                minDistance = Math.max(22, minDistance - 1);
            }
        }

        return positions;
    }

    function createToyAt(position, combination) {

        return new Toy(
            position.x,
            position.y,
            combination
        );
    }

    function createToys() {

        toys = [];

        createCombinationDeck();

        const positions = generateToyPositions(TOY_COUNT);

        for (const position of positions) {

            toys.push(
                createToyAt(position, getNextCombination())
            );
        }
    }

    // 抓走一隻後補回一隻
    function refillOneToy() {

        if (toys.length >= TOY_COUNT) return;

        if (combinationIndex >= combinationDeck.length) return;

        const [position] = generateToyPositions(1, toys);

        if (!position) return;

        const combination = getNextCombination();

        if (combination) {

            toys.push(
                createToyAt(position, combination)
            );
        }
    }

    // =====================================
    // 八、尋找夾爪附近的娃娃
    // =====================================

    function findNearestToy() {

        let nearest = null;
        let minDistance = Infinity;

        const targetX = claw.x;
        const targetY = claw.y + claw.dropOffset;

        for (const toy of toys) {

            const distance = Math.hypot(
                targetX - toy.x,
                targetY - toy.y
            );

            if (distance < minDistance) {

                minDistance = distance;
                nearest = toy;
            }
        }

        return nearest && minDistance <= 45
            ? nearest
            : null;
    }

    // =====================================
    // 九、開始抓取
    // =====================================

    function startGrab() {

        if (gameState !== STATE_IDLE) return;

        if (toys.length === 0) {

            resultBox.textContent =
                "本輪 1,000 種組合已全部使用！請重新開始。";

            return;
        }

        gameState = STATE_DROPPING;

        resultBox.textContent = "夾爪正在下降……";
    }

    // =====================================
    // 十、搖桿控制
    // =====================================

    function updateJoystick(event) {

        const rect = joystick.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = event.clientX - centerX;
        let dy = event.clientY - centerY;

        const maxDistance = 34;

        const distance = Math.hypot(dx, dy);

        if (distance > maxDistance) {

            dx = dx / distance * maxDistance;
            dy = dy / distance * maxDistance;
        }

        joystickX = dx / maxDistance;
        joystickY = dy / maxDistance;

        stick.style.left = `calc(50% + ${dx}px)`;
        stick.style.top = `calc(50% + ${dy}px)`;
    }

    function resetJoystick() {

        joystickX = 0;
        joystickY = 0;
        joystickActive = false;

        stick.style.left = "50%";
        stick.style.top = "50%";
    }

    joystick.addEventListener("pointerdown", event => {

        joystickActive = true;

        joystick.setPointerCapture(event.pointerId);

        updateJoystick(event);
    });

    joystick.addEventListener("pointermove", event => {

        if (joystickActive) {
            updateJoystick(event);
        }
    });

    joystick.addEventListener("pointerup", resetJoystick);
    joystick.addEventListener("pointercancel", resetJoystick);
    joystick.addEventListener("lostpointercapture", resetJoystick);

    // =====================================
    // 十一、鍵盤控制
    // =====================================

    window.addEventListener("keydown", event => {

        keys[event.code] = true;

        if (event.code === "Space") {

            event.preventDefault();

            if (!event.repeat) {
                startGrab();
            }
        }
    });

    window.addEventListener("keyup", event => {

        keys[event.code] = false;
    });

    // =====================================
    // 十二、移動夾爪
    // =====================================

    function moveClaw() {

        if (gameState !== STATE_IDLE) return;

        let dx = joystickX;
        let dy = joystickY;

        if (keys["ArrowLeft"]) dx -= 1;
        if (keys["ArrowRight"]) dx += 1;
        if (keys["ArrowUp"]) dy -= 1;
        if (keys["ArrowDown"]) dy += 1;

        const length = Math.hypot(dx, dy);

        if (length > 1) {

            dx /= length;
            dy /= length;
        }

        claw.x += dx * claw.speedX;
        claw.y += dy * claw.speedY;

        claw.x = Math.max(85, Math.min(380, claw.x));
        claw.y = Math.max(190, Math.min(350, claw.y));
    }

    // =====================================
    // 十三、遊戲更新
    // =====================================

    function update() {

        moveClaw();

        switch (gameState) {

            case STATE_IDLE:
                break;

            // 夾爪下降
            case STATE_DROPPING:

                claw.dropOffset += 5;

                if (claw.dropOffset >= claw.maxDrop) {

                    claw.dropOffset = claw.maxDrop;

                    gameState = STATE_GRABBING;
                }

                break;

            // 嘗試抓取
            case STATE_GRABBING:

                heldToy = findNearestToy();

                claw.heldToy = heldToy;

                if (heldToy) {

                    heldToy.x = claw.x;
                    heldToy.y = claw.y + claw.dropOffset + 20;
                }

                gameState = STATE_RISING;

                break;

            // 夾爪上升
            case STATE_RISING:

                claw.dropOffset -= 5;

                if (heldToy) {

                    heldToy.x = claw.x;
                    heldToy.y = claw.y + claw.dropOffset + 20;
                }

                if (claw.dropOffset <= 0) {

                    claw.dropOffset = 0;

                    gameState = STATE_RETURNING;

                    resultBox.textContent = heldToy
                        ? "抓到了！正在送往出貨口……"
                        : "沒有抓到娃娃，請再試一次！";
                }

                break;

            // 移動至出貨口
            case STATE_RETURNING: {

                claw.x = Math.max(45, claw.x - 4);

                if (claw.y < 390) {

                    claw.y = Math.min(390, claw.y + 3);

                } else if (claw.y > 390) {

                    claw.y = Math.max(390, claw.y - 3);
                }

                if (heldToy) {

                    heldToy.x = claw.x;
                    heldToy.y = claw.y + 22;
                }

                if (claw.x === 45 && claw.y === 390) {

                    if (heldToy) {

                        gameState = STATE_DELIVERING;

                        resultBox.textContent =
                            "娃娃正在掉進出貨口！";

                    } else {

                        gameState = STATE_IDLE;

                        claw.y = 220;

                        resultBox.textContent =
                            "沒有抓到娃娃，請再試一次！";
                    }
                }

                break;
            }

            // =================================
            // 十四、成功出貨後揭曉答案
            // =================================

            case STATE_DELIVERING: {

                if (heldToy) {

                    heldToy.x = 45;
                    heldToy.y += 7;

                    if (heldToy.y >= 490) {

                        const selectedCombination =
                            heldToy.combination;

                        toys = toys.filter(
                            toy => toy !== heldToy
                        );

                        heldToy = null;
                        claw.heldToy = null;

                        score++;

                        refillOneToy();

                        // 只有成功抓取後才揭曉隱藏屬性
                        let result =
                            `${selectedCombination.species}+${selectedCombination.color}+${selectedCombination.accessory}`;

                        if (
                            combinationIndex >= combinationDeck.length &&
                            toys.length === 0
                        ) {

                            result +=
                                "\n\n本輪 1,000 種組合已全部使用！";
                        }

                        resultBox.textContent = result;

                        claw.x = 220;
                        claw.y = 220;
                        claw.dropOffset = 0;

                        gameState = STATE_IDLE;
                    }
                }

                break;
            }
        }
    }

    // =====================================
    // 十五、繪製背景
    // =====================================

    function drawBackground() {

        ctx.fillStyle = "#fff0f3";

        ctx.fillRect(0, 0, 400, 520);

        // 上方橫線
        ctx.strokeStyle = "#ff6b8b";
        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(30, 60);
        ctx.lineTo(370, 60);

        ctx.stroke();

        // 出貨口
        ctx.fillStyle = "#e0a6b1";

        ctx.fillRect(15, 430, 65, 90);

        ctx.fillStyle = "#2d2d2d";

        ctx.fillRect(20, 440, 55, 80);

        ctx.fillStyle = "rgba(255, 182, 193, 0.6)";

        ctx.fillRect(80, 450, 6, 70);
    }

    // =====================================
    // 十六、繪製夾爪
    // =====================================

    function drawClaw() {

        const tipY = claw.y + claw.dropOffset;

        // 連接線
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(claw.x, 60);
        ctx.lineTo(claw.x, tipY);

        ctx.stroke();

        // 夾爪中心
        ctx.fillStyle = "#ff4d6d";

        ctx.beginPath();

        ctx.arc(claw.x, tipY, 9, 0, Math.PI * 2);

        ctx.fill();

        ctx.strokeStyle = "#ff4d6d";
        ctx.lineWidth = 3.5;
        ctx.lineCap = "round";

        if (gameState === STATE_GRABBING || heldToy) {

            // 閉合
            ctx.beginPath();

            ctx.moveTo(claw.x - 13, tipY);
            ctx.lineTo(claw.x - 8, tipY + 20);

            ctx.moveTo(claw.x + 13, tipY);
            ctx.lineTo(claw.x + 8, tipY + 20);

            ctx.stroke();

        } else {

            // 張開
            ctx.beginPath();

            ctx.moveTo(claw.x, tipY);
            ctx.lineTo(claw.x - 13, tipY + 20);

            ctx.moveTo(claw.x, tipY);
            ctx.lineTo(claw.x + 13, tipY + 20);

            ctx.stroke();
        }
    }

    // =====================================
    // 十七、繪製整個畫面
    // =====================================

    function draw() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        drawBackground();

        const sortedToys = [...toys].sort(
            (a, b) => a.y - b.y
        );

        // 繪製未被抓住的娃娃
        for (const toy of sortedToys) {

            if (toy !== heldToy) {
                toy.draw();
            }
        }

        // 繪製被抓住的娃娃
        if (heldToy) {
            heldToy.draw();
        }

        drawClaw();

        // 出貨數量
        ctx.fillStyle = "#ff4d6d";
        ctx.font = "bold 18px 'Microsoft JhengHei'";
        ctx.textAlign = "left";

    }

    // =====================================
    // 十八、遊戲主迴圈
    // =====================================

    function gameLoop() {

        update();

        draw();

        requestAnimationFrame(gameLoop);
    }

    // =====================================
    // 十九、按鈕事件
    // =====================================

    document.getElementById("btnDrop")
        .addEventListener("click", startGrab);

    document.getElementById("btnReset")
        .addEventListener("click", () => {

            score = 0;

            heldToy = null;

            claw.heldToy = null;

            claw.x = 220;
            claw.y = 220;
            claw.dropOffset = 0;

            gameState = STATE_IDLE;

            resultBox.textContent =
                "重新開始！抓一隻娃娃吧！";

            resetJoystick();

            createToys();
        });

    // =====================================
    // 二十、啟動遊戲
    // =====================================

    createToys();

    gameLoop();

});
</script>
