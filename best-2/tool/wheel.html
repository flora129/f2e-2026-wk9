
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸運抽籤轉盤</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 18px 10px;
    overflow-x: hidden;

    background-color: #ffeef2;
    background-image:
        radial-gradient(circle at 12px 12px, rgba(255,255,255,.9) 0 2px, transparent 2.8px),
        radial-gradient(circle at 42px 38px, rgba(244,181,201,.45) 0 2px, transparent 3px),
        radial-gradient(circle at 78px 72px, rgba(255,255,255,.75) 0 3px, transparent 4px),
        radial-gradient(circle at 105px 20px, rgba(244,181,201,.35) 0 1.5px, transparent 2.5px),
        linear-gradient(135deg, #fff4f7 0%, #ffeaf1 48%, #fff1f5 100%);

    background-size:
        120px 120px,
        150px 150px,
        180px 180px,
        130px 130px,
        auto;
}

/* 上下星星裝飾 */
body::before,
body::after {
    content: "✦     ✧       ✦        ✧";
    position: fixed;
    left: 0;
    width: 100%;
    color: #e8b2c3;
    font-size: 17px;
    letter-spacing: 24px;
    text-align: center;
    opacity: .55;
    pointer-events: none;
    z-index: 0;
}

body::before {
    top: 7%;
}

body::after {
    content: "✧       ✦        ✧      ✦";
    bottom: 7%;
}

.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    text-align: center;
}

.wheel-window {
    position: relative;
    padding: 0;
    margin: 0 auto 25px;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
}

#canvas {
    display: block;
    width: 100%;
    max-width: 550px;
    height: auto;
    margin: auto;
}

/* 開始按鈕 */
#spinBtn {
    min-width: 210px;
    padding: 16px 30px;
    font-size: 22px;
    letter-spacing: 2px;
    border: none;
    border-radius: 18px;
    color: white;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(180deg, #ff829f, #f04475);
    box-shadow: 0 6px 0 #c92d5b;
    text-shadow: 1px 2px 2px rgba(130, 30, 60, 0.25);
    transition: transform 0.15s, filter 0.15s;
}

#spinBtn:hover {
    background: linear-gradient(180deg, #ff9db4, #fa5d89);
    transform: translateY(-2px);
}

#spinBtn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #c92d5b;
}

#spinBtn:disabled {
    background: #ccc;
    box-shadow: 0 4px 0 #aaa;
    cursor: not-allowed;
}

#winner {
    min-height: 35px;
    margin-top: 22px;
    color: #c34c78;
    font-size: 24px;
    font-weight: bold;
}

/* ===== 中獎彈出視窗 ===== */

.result-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: none;
    justify-content: center;
    align-items: center;

    padding: 20px;
    background: rgba(115, 65, 83, 0.22);
    backdrop-filter: blur(4px);
    cursor: pointer;
}

.result-overlay.show {
    display: flex;
    animation: fadeIn 0.3s ease;
}

/* 橫向長方形 */
.result-box {
    position: relative;
    width: min(88%, 480px);
    min-height: 145px;
    padding: 20px 30px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 9px;

    background: linear-gradient(135deg, #fffdfd, #fff0f5);
    border: 2px solid #edbdce;
    border-radius: 20px;

    box-shadow:
        0 0 0 6px rgba(255,255,255,0.45),
        0 12px 35px rgba(190, 105, 135, 0.25);

    animation: popIn 0.4s cubic-bezier(.2, 1.4, .4, 1);
}

.result-box::before {
    content: "✦";
    position: absolute;
    top: 13px;
    left: 20px;
    color: #e8b2c3;
    font-size: 20px;
}

.result-box::after {
    content: "✧";
    position: absolute;
    bottom: 10px;
    right: 22px;
    color: #e8b2c3;
    font-size: 23px;
}

.result-title {
    color: #c77f9a;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 5px;
}

.result-text {
    color: #b94e78;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes popIn {
    from {
        opacity: 0;
        transform: scale(0.75);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 480px) {
    #spinBtn {
        width: 90%;
    }

    .result-box {
        width: 92%;
        min-height: 130px;
    }

    .result-text {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="wheel-window">
        <canvas id="canvas" width="550" height="550"></canvas>
    </div>

    <button id="spinBtn">開始旋轉</button>

    <div id="winner"></div>

</div>

<!-- 中獎彈出視窗 -->
<div class="result-overlay" id="resultOverlay">
    <div class="result-box">
        <div class="result-title">✦ 抽中啦 ✦</div>
        <div class="result-text" id="resultText"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const spinBtn = document.getElementById('spinBtn');
const winnerDiv = document.getElementById('winner');

const resultOverlay = document.getElementById('resultOverlay');
const resultText = document.getElementById('resultText');

/* 載入中央人物圖片 */
const centerImage = new Image();
centerImage.src = "../images/center.png";

centerImage.onload = () => {
    drawWheel();
};

centerImage.onerror = () => {
    console.error("無法載入 center.png，請確認圖片與 HTML 位於同一資料夾。");
};

let options = [
    "選項一",
    "選項二",
    "選項三",
    "選項四",
    "選項五",
    "選項六",
    "選項七",
    "選項八"
];

/* 轉盤扇形配色 */
const colors = [
    '#F4C7D5',
    '#F6D9C8',
    '#F8E8B8',
    '#D8E8D5',
    '#D5E5F2',
    '#DDD5EB',
    '#EBCFD8',
    '#F3E1D2'
];

/* 外圍跑馬燈 */
const lightColors = [
    '#FFE6A7',
    '#FFFFFF',
    '#F4B8CC',
    '#D5E5F2',
    '#F8D9B8'
];

let startAngle = 0;
let arc = Math.PI / (options.length / 2);
let spinTimeout = null;
let spinAngleStart = 10;
let spinTime = 0;

const CONSTANT_SPEED_TIME = 3000;
const DECELERATION_TIME = 2000;
const spinTimeTotal = CONSTANT_SPEED_TIME + DECELERATION_TIME;

let lightTick = 0;

/* 繪製轉盤 */
function drawWheel() {
    if (options.length === 0) return;

    ctx.clearRect(0, 0, 550, 550);

    const cx = 275;
    const cy = 275;
    const outerR = 250;
    const wheelR = 225;

    /* 外圍裝飾圈 */
    ctx.fillStyle = "#E8B5C5";
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.fill();

    /* 扇形區域 */
    for (let i = 0; i < options.length; i++) {
        const angle = startAngle + i * arc;

        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, wheelR, angle, angle + arc, false);
        ctx.lineTo(cx, cy);
        ctx.fill();

        /* 扇形文字 */
        ctx.save();
        ctx.fillStyle = "#70545F";
        ctx.font = "bold 16px sans-serif";

        ctx.translate(
            cx + Math.cos(angle + arc / 2) * (wheelR * 0.65),
            cy + Math.sin(angle + arc / 2) * (wheelR * 0.65)
        );

        ctx.rotate(angle + arc / 2 + Math.PI / 2);

        const text = options[i];
        ctx.fillText(
            text,
            -ctx.measureText(text).width / 2,
            0
        );

        ctx.restore();
    }

    /* 外圍跑馬燈 */
    const totalLights = 40;
    lightTick++;

    for (let i = 0; i < totalLights; i++) {
        const angle = (i / totalLights) * Math.PI * 2;

        const lx = cx + Math.cos(angle) * (outerR - 12);
        const ly = cy + Math.sin(angle) * (outerR - 12);

        const colorIndex =
            (i + Math.floor(lightTick / 5)) % lightColors.length;

        ctx.fillStyle = lightColors[colorIndex];
        ctx.shadowBlur = 6;
        ctx.shadowColor = lightColors[colorIndex];

        if (i % 2 === 0) {
            ctx.beginPath();
            ctx.arc(lx, ly, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.strokeStyle = lightColors[colorIndex];
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(lx - 5, ly);
            ctx.lineTo(lx + 5, ly);
            ctx.moveTo(lx, ly - 5);
            ctx.lineTo(lx, ly + 5);
            ctx.stroke();
        }

        ctx.shadowBlur = 0;
    }

    /* 中央人物圖片底框 */
    ctx.fillStyle = "#E8B5C5";
    ctx.beginPath();
    ctx.arc(cx, cy, 52, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#FFF7F8";
    ctx.beginPath();
    ctx.arc(cx, cy, 48, 0, Math.PI * 2);
    ctx.fill();

    /* 顯示人物圖片，保留透明背景 */
    if (centerImage.complete && centerImage.naturalWidth > 0) {
        ctx.drawImage(
        centerImage,
        cx - 30,
        cy - 33.65,
        60,
        67.3
        );
    }

    /* 上方固定指針 */
    ctx.fillStyle = "#D8799A";
    ctx.beginPath();
    ctx.moveTo(cx - 15, cy - outerR - 5);
    ctx.lineTo(cx + 15, cy - outerR - 5);
    ctx.lineTo(cx, cy - outerR + 25);
    ctx.closePath();
    ctx.fill();
}

/* 待機時燈光閃爍 */
setInterval(() => {
    if (spinTimeout === null) {
        drawWheel();
    }
}, 40);

/* 轉盤旋轉 */
function rotateWheel() {
    spinTime += 16;

    if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
    }

    let currentSpeed;

    if (spinTime < CONSTANT_SPEED_TIME) {
        currentSpeed = spinAngleStart;
    } else {
        const decelElapsedTime = spinTime - CONSTANT_SPEED_TIME;

        currentSpeed = spinAngleStart -
            easeOut(
                decelElapsedTime,
                0,
                spinAngleStart,
                DECELERATION_TIME
            );
    }

    startAngle += currentSpeed * Math.PI / 180;

    drawWheel();

    spinTimeout = setTimeout(rotateWheel, 16);
}

/* 停止並顯示中獎視窗 */
function stopRotateWheel() {
    clearTimeout(spinTimeout);
    spinTimeout = null;

    const degrees = startAngle * 180 / Math.PI + 90;
    const ardegrees = arc * 180 / Math.PI;

    const index = Math.floor(
        (360 - (degrees % 360)) / ardegrees
    );

    const finalResult =
        options[(index + options.length) % options.length];

    /* 顯示抽中選項 */
    resultText.textContent = finalResult;
    resultOverlay.classList.add('show');

    spinBtn.disabled = false;
}

/* 減速動畫 */
function easeOut(t, b, c, d) {
    const ts = (t /= d) * t;
    const tc = ts * t;

    return b + c * (tc + -3 * ts + 3 * t);
}

/* 開始抽籤 */
spinBtn.addEventListener('click', () => {
    if (options.length === 0 || spinTimeout !== null) return;

    winnerDiv.textContent = "";
    spinBtn.disabled = true;

    spinAngleStart = Math.random() * 15 + 85;
    spinTime = 0;

    rotateWheel();
});

/* 點擊畫面任意位置關閉中獎視窗 */
resultOverlay.addEventListener('click', () => {
    resultOverlay.classList.remove('show');
});

/* 初始化 */
drawWheel();

</script>

</body>
</html>
