<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

:root {
    --pink: #f58ba8;
    --deep-pink: #d95e83;
    --light-pink: #fff0f4;
    --border-pink: #f5c4d2;
    --cream: #fffaf0;
    --gold: #d8ad69;
    --brown: #896174;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 12px;
    background:
        radial-gradient(circle at 10% 15%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 90% 80%, #ffffff 0 3px, transparent 4px),
        #ffeef2;
    background-size: 42px 42px, 55px 55px;
    font-family: "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--brown);
    overflow-x: hidden;
}

h1 {
    color: #e87598;
    font-size: clamp(25px, 5vw, 36px);
    letter-spacing: 3px;
    margin: 0 0 8px;
    text-shadow: 2px 3px 0 white;
    text-align: center;
}

.subtitle {
    color: #bd8197;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 35px;
}

/* ===== 機台整體 ===== */

.wrapper {
    width: 100%;
    max-width: 660px;
    padding-right: 75px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.machine {
    position: relative;
    width: 100%;
    background: linear-gradient(145deg, #ffffff, #fff9fb);
    border: 5px solid #f4c3d1;
    border-radius: 36px;
    padding: 18px;
    box-shadow:
        0 13px 0 #e8aabd,
        0 20px 35px rgba(184, 105, 135, 0.22),
        inset 0 0 0 3px white;
    z-index: 2;
}

/* 機台內框 */

.machine-inner {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #fff1f5, #ffe8ef);
    border: 2px solid #f5c5d4;
    border-radius: 25px;
    padding: 22px 17px 20px;
}

/* 角落裝飾 */

.corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 2px solid #e9b4c5;
    opacity: .75;
}

.corner::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    background: #e9b4c5;
    border-radius: 50%;
}

.corner.tl {
    top: 8px;
    left: 8px;
    border-right: 0;
    border-bottom: 0;
    border-radius: 12px 0 0 0;
}

.corner.tr {
    top: 8px;
    right: 8px;
    border-left: 0;
    border-bottom: 0;
    border-radius: 0 12px 0 0;
}

.corner.bl {
    bottom: 8px;
    left: 8px;
    border-right: 0;
    border-top: 0;
    border-radius: 0 0 0 12px;
}

.corner.br {
    bottom: 8px;
    right: 8px;
    border-left: 0;
    border-top: 0;
    border-radius: 0 0 12px 0;
}

/* ===== 頂部招牌 ===== */

.top-decoration {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin-bottom: 8px;
}

.top-decoration .line {
    height: 2px;
    width: 45px;
    background: #e9b6c6;
}

.top-star {
    color: #d7a75e;
    font-size: 15px;
}

.machine-header {
    position: relative;
    background: linear-gradient(135deg, #f7a4b9, #e982a0);
    border: 3px solid #ffffff;
    outline: 1px solid #eab0c2;
    border-radius: 18px 18px 12px 12px;
    padding: 15px 8px 13px;
    margin-bottom: 18px;
    color: #fffdfd;
    text-align: center;
    box-shadow:
        0 5px 0 #e6a0b5,
        inset 0 2px 5px rgba(255,255,255,.4);
}

.header-small {
    font-family: Georgia, serif;
    font-size: 9px;
    letter-spacing: 4px;
    opacity: .9;
    margin-bottom: 5px;
}

.header-title {
    font-family: Georgia, "Microsoft JhengHei", serif;
    font-size: clamp(18px, 4vw, 25px);
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 1px 2px 2px rgba(174, 76, 108, .2);
}

.header-bottom {
    font-size: 9px;
    letter-spacing: 3px;
    margin-top: 5px;
    opacity: .9;
}

/* 裝飾燈泡 */

.light-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 17px 0 15px;
}

.light {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f5c66e;
    border: 2px solid white;
    box-shadow: 0 0 5px #f6d78e;
}

.light:nth-child(even) {
    background: #ffffff;
}

/* ===== 滾輪區 ===== */

.reels-container {
    position: relative;
    display: flex;
    gap: clamp(7px, 2.5vw, 15px);
    justify-content: center;
    align-items: center;
    padding: clamp(13px, 3vw, 20px);
    background: linear-gradient(180deg, #fffdfc, #fff7f8);
    border: 4px solid #eab6c8;
    border-radius: 22px;
    box-shadow:
        inset 0 4px 10px rgba(176, 110, 135, .12),
        0 4px 0 #f4d4df;
    margin-bottom: 15px;
}

.reels-container::before,
.reels-container::after {
    content: "✦";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #d8ad69;
    font-size: 14px;
}

.reels-container::before {
    left: 5px;
}

.reels-container::after {
    right: 5px;
}

.reel-window {
    flex: 1;
    min-width: 0;
    max-width: 125px;
    aspect-ratio: 1 / 1;
    background: linear-gradient(145deg, #fffaf5, #fff0f3);
    border: 3px solid #f0c4d0;
    border-radius: 17px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-shadow:
        inset 0 3px 9px rgba(176, 110, 135, .12),
        0 3px 0 #f7dce5;
    position: relative;
}

.reel-window::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(230, 176, 193, .35);
    border-radius: 10px;
    pointer-events: none;
}

.symbol {
    width: 76%;
    height: 76%;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform .15s;
}

.symbol svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 3px 2px rgba(125, 79, 91, .12));
}

.wrapper.spinning .symbol {
    animation: symbolFlash .12s infinite alternate;
}

@keyframes symbolFlash {
    from {
        transform: translateY(-5px) scale(.94);
        opacity: .75;
    }
    to {
        transform: translateY(5px) scale(1.04);
        opacity: 1;
    }
}

/* ===== 分隔裝飾 ===== */

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0;
    color: #d7a75e;
    font-size: 12px;
    letter-spacing: 3px;
}

.divider::before,
.divider::after {
    content: "";
    width: 55px;
    height: 1px;
    background: #e8b8c7;
}

/* ===== 訊息區 ===== */

.message {
    min-height: 46px;
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #d9577b;
    font-weight: bold;
    font-size: clamp(14px, 3.5vw, 19px);
    letter-spacing: 1px;
}

.message.win {
    animation: winPulse .6s infinite alternate;
}

@keyframes winPulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.07);
    }
}

/* ===== 底部裝飾 ===== */

.bottom-decoration {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 13px;
    margin-top: 8px;
    color: #c68ba0;
    font-family: Georgia, serif;
    font-size: 9px;
    letter-spacing: 3px;
}

.bottom-decoration span {
    color: #d8ad69;
    font-size: 14px;
}

/* ===== 實體拉桿 ===== */

.handle-container {
    position: absolute;
    right: 0;
    top: 34%;
    width: 75px;
    height: 190px;
    cursor: grab;
    z-index: 3;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.handle-container:active {
    cursor: grabbing;
}

.handle-base {
    position: absolute;
    left: 0;
    top: 80px;
    width: 30px;
    height: 43px;
    border: 3px solid #ffffff;
    border-radius: 8px;
    background: linear-gradient(135deg, #f8c2d1, #df94ac);
    box-shadow:
        0 4px 0 #d78ba5,
        0 5px 8px rgba(120, 75, 90, .15);
}

.handle-rod {
    position: absolute;
    left: 12px;
    bottom: 82px;
    width: 13px;
    height: 95px;
    border: 1px solid #d6c1c5;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        #c8b8bd,
        #ffffff 35%,
        #e4d5d9 75%,
        #bca9af
    );

    /* 固定底部作為旋轉支點 */
    transform-origin: bottom center;

    transition: transform .35s cubic-bezier(.25, 1, .5, 1);

    box-shadow: 2px 3px 5px rgba(90, 65, 75, .2);
}

/* 拖曳時取消動畫延遲，讓桿子跟隨滑鼠 */
.handle-container.dragging .handle-rod {
    transition: none;
}

.handle-ball {
    position: absolute;
    top: -25px;
    left: -17px;
    width: 46px;
    height: 46px;
    border: 3px solid white;
    border-radius: 50%;
    background:
        radial-gradient(circle at 32% 25%, #fff8fb 0 8%, transparent 10%),
        radial-gradient(circle at 35% 30%, #ffcfdd, #f27f9f 60%, #d95e83);
    box-shadow:
        0 4px 0 #d65e82,
        0 6px 12px rgba(210, 90, 125, .3),
        inset 0 2px 5px rgba(255,255,255,.8);
}

/* 拉霸時拉桿轉動 */

.wrapper.spinning .handle-rod {
    transform: rotate(32deg);
}

.wrapper.spinning .handle-container {
    pointer-events: none;
    cursor: not-allowed;
}

/* ===== 提示 ===== */

.tips {
    margin-top: 28px;
    color: #a77b90;
    font-size: 12px;
    text-align: center;
    line-height: 2;
    letter-spacing: 1px;
}

.tips strong {
    color: #d66f91;
}

/* ===== 中獎裝飾 ===== */

.wrapper.jackpot .machine {
    animation: jackpotShake .35s infinite alternate;
}

@keyframes jackpotShake {
    from {
        transform: rotate(-.5deg);
    }
    to {
        transform: rotate(.5deg);
    }
}

/* ===== 手機版 ===== */

@media (max-width: 480px) {
    body {
        padding: 25px 8px;
    }

    .subtitle {
        margin-bottom: 25px;
    }

    .wrapper {
        padding-right: 48px;
    }

    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .machine-inner {
        padding: 17px 9px;
    }

    .handle-container {
        transform: scale(.76);
        transform-origin: right center;
    }

    .header-title {
        letter-spacing: 2px;
    }

    .reels-container {
        padding: 12px 9px;
    }

    .reel-window {
        border-radius: 12px;
    }
}
</style>
</head>

        </g>
        <path d="M36 60 H64" stroke="#fff5d2"
              stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <!-- 四葉草 -->
    <symbol id="clover" viewBox="0 0 100 100">
        <g fill="#94c88b" stroke="#639b69" stroke-width="2">
            <path d="M50 48 C25 48 22 21 40 17 C53 14 58 31 50 48Z"/>
            <path d="M52 48 C52 22 79 20 83 38 C86 51 68 58 52 48Z"/>
            <path d="M52 51 C78 51 78 78 60 83 C47 86 42 68 52 51Z"/>
            <path d="M48 51 C48 77 21 79 17 61 C14 48 32 42 48 51Z"/>
        </g>
        <path d="M51 52 Q50 72 35 89" fill="none"
              stroke="#6f9d67" stroke-width="5" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="4" fill="#d8edb7"/>
    </symbol>

    <!-- 蝴蝶結 -->
    <symbol id="bow" viewBox="0 0 100 100">
        <path d="M47 47 C22 12 7 26 17 53 C24 72 38 62 49 54Z"
              fill="url(#pinkFruit)" stroke="#dc7899" stroke-width="3"/>
        <path d="M53 47 C78 12 93 26 83 53 C76 72 62 62 51 54Z"
              fill="url(#pinkFruit)" stroke="#dc7899" stroke-width="3"/>
        <path d="M43 55 L35 89 L52 73 L65 89 L57 55"
              fill="#eea1b8" stroke="#dc7899" stroke-width="3"/>
        <circle cx="50" cy="50" r="10" fill="#fff0f4"
                stroke="#d87598" stroke-width="3"/>
        <circle cx="47" cy="47" r="3" fill="#ffffff"/>
    </symbol>

    <!-- 星星 -->
    <symbol id="star" viewBox="0 0 100 100">
        <path d="M50 7 L62 36 L94 39 L70 60 L77 92
                 L50 75 L23 92 L30 60 L6 39 L38 36Z"
              fill="url(#gold)" stroke="#c69a50" stroke-width="3"
              stroke-linejoin="round"/>
        <path d="M50 19 L57 41 L79 43 L62 57 L67 79
                 L50 67 L33 79 L38 57 L21 43 L43 41Z"
              fill="#ffeeb6" opacity=".45"/>
        <circle cx="50" cy="48" r="5" fill="#ffffff" opacity=".8"/>
    </symbol>

</defs>
</svg>

<script>
/* ===== 圖案資料 ===== */

const symbols = [
    "cherry",
    "strawberry",
    "lemon",
    "grape",
    "orange",
    "watermelon",
    "pineapple",
    "bell",
    "diamond",
    "crown",
    "clover",
    "bow",
    "star"
];

const symbolNames = {
    cherry: "櫻桃",
    strawberry: "草莓",
    lemon: "檸檬",
    grape: "葡萄",
    orange: "橘子",
    watermelon: "西瓜",
    pineapple: "鳳梨",
    bell: "幸運鈴鐺",
    diamond: "寶石",
    crown: "皇冠",
    clover: "四葉草",
    bow: "蝴蝶結",
    star: "幸運星"
};

/* ===== DOM ===== */

const msg = document.getElementById("msg");
const wrapper = document.getElementById("gameWrapper");
const handle = document.getElementById("handle");

const rod = handle.querySelector(".handle-rod");

const reels = [
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];

let spinning = false;

/* ===== 拉桿操作狀態 ===== */

let isDragging = false;
let startY = 0;

const maxPullDistance = 55;
const maxPullAngle = 30;

/* ===== 顯示 SVG 圖案 ===== */

function showSymbol(element, symbol) {
    element.innerHTML = `
        <svg viewBox="0 0 100 100" role="img"
             aria-label="${symbolNames[symbol]}">
            <use href="#${symbol}"></use>
        </svg>
    `;
}

/* ===== 隨機圖案 ===== */

function randomSymbol() {
    return symbols[Math.floor(Math.random() * symbols.length)];
}

/* ===== 初始化 ===== */

function init() {
    reels.forEach(reel => {
        showSymbol(reel, "strawberry");
    });
}

init();

/* ===== 開始拉霸 ===== */

function spin() {

    if (spinning) return;

    spinning = true;

    wrapper.classList.add("spinning");
    wrapper.classList.remove("jackpot");

    msg.classList.remove("win");

    msg.innerText = "幸運旋轉中...";
    msg.style.color = "#ed7295";

    const intervals = [];
    const results = [];

    // 三個轉輪開始快速轉動
    reels.forEach((reel, index) => {

        const intervalId = setInterval(() => {
            showSymbol(reel, randomSymbol());
        }, 70);

        intervals.push(intervalId);
    });

    // 依序停止：4 秒、4.5 秒、5 秒
    reels.forEach((reel, index) => {

        const stopTime = 4000 + index * 500;

        setTimeout(() => {

            clearInterval(intervals[index]);

            const finalSymbol = randomSymbol();

            showSymbol(reel, finalSymbol);
            results[index] = finalSymbol;

            // 三個轉輪全部停止
            if (results.filter(Boolean).length === 3) {

                wrapper.classList.remove("spinning");

                checkResult(results);
            }

        }, stopTime);
    });
}

/* ===== 中獎判定 ===== */

function checkResult(results) {

    spinning = false;

    const isWin = results.every(
        symbol => symbol === results[0]
    );

    if (!isWin) {

        msg.innerText = "差一點點！再試一次吧";
        msg.style.color = "#a77b90";

        return;
    }

    const winSymbol = results[0];
    const name = symbolNames[winSymbol];

    msg.classList.add("win");

    if (winSymbol === "star") {

        wrapper.classList.add("jackpot");

        msg.innerText = "JACKPOT！超級幸運大獎！";
        msg.style.color = "#d49b42";

    } else if (
        ["diamond", "crown", "bow"].includes(winSymbol)
    ) {

        msg.innerText = `恭喜！${name}豪華連線！`;
        msg.style.color = "#d9577b";

    } else {

        msg.innerText = `恭喜成功連線：${name}！`;
        msg.style.color = "#75465c";
    }
}

/* ===== 拉桿點擊與拖曳操作 ===== */

handle.addEventListener("pointerdown", function(e) {

    if (spinning || isDragging) return;

    e.preventDefault();

    isDragging = true;
    startY = e.clientY;

    handle.classList.add("dragging");

    // 確保滑鼠移出拉桿範圍後仍能繼續偵測
    handle.setPointerCapture(e.pointerId);
});

handle.addEventListener("pointermove", function(e) {

    if (!isDragging || spinning) return;

    e.preventDefault();

    // 計算向下拖曳距離
    const distance = e.clientY - startY;

    // 限制拖曳距離
    const pullDistance = Math.max(
        0,
        Math.min(distance, maxPullDistance)
    );

    // 將拖曳距離換算成旋轉角度
    const angle = (pullDistance / maxPullDistance) * maxPullAngle;

    /*
       只旋轉，不使用 translateY。
       因為 transform-origin 設定在底部，
       所以桿子底部會固定在機身支點。
    */
    rod.style.transform = `rotate(${angle}deg)`;
});

handle.addEventListener("pointerup", function() {

    if (!isDragging) return;

    isDragging = false;

    handle.classList.remove("dragging");

    // 清除拖曳時的 inline transform
    rod.style.transform = "";

    // 點擊或拖曳放開都會啟動拉霸
    if (!spinning) {
        spin();
    }
});

handle.addEventListener("pointercancel", function() {

    isDragging = false;

    handle.classList.remove("dragging");

    // 取消拖曳時還原拉桿，不啟動遊戲
    rod.style.transform = "";
});

</script>

</body>
</html>
