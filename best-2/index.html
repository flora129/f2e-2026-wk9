<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PickMe｜幫我做選擇</title>

  <!-- 字體：logo 用 Caveat 手寫體，中文用 Huninn 粉圓體（載入失敗會自動退回系統字體） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style2.css?v=login-icon">
  <link rel="stylesheet" href="ghosts.css">
  <link rel="stylesheet" href="cursor.css">
</head>
<body class="loading">

<!-- ===== 進場 Loading：工具們輪流跳 → 整塊往上拉開 ===== -->
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="loader-body">
    <img class="loader-logo" src="images/pickme-logo.png" alt="PickMe!" draggable="false">
    <div class="loader-tools" aria-hidden="true">
      <img src="images/tool-gacha.png" alt="" style="--i:0">
      <img src="images/tool-slot.png"  alt="" style="--i:1">
      <img src="images/tool-claw.png"  alt="" style="--i:2">
      <img src="images/tool-wheel.png" alt="" style="--i:3">
      <img src="images/tool-card.png" alt="" style="--i:4">
    </div>
    <p class="loader-text">幫你想想看<span>.</span><span>.</span><span>.</span></p>
  </div>
  <svg class="loader-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H1440V50C1360 100 1280 100 1200 60S1040 20 960 60 800 110 720 70 560 20 480 60 320 105 240 70 80 30 0 70Z"/></svg>
</div>


<!-- ===== SVG 共用定義：手繪抖動濾鏡 + 雲朵形狀 ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- 三組不同 seed 的雜訊位移濾鏡：輪流切換就會有「手繪線條在呼吸」的效果 -->
    <filter id="rough1" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="rough2" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="rough3" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>

    <!-- 雲朵：一堆圓 + 中間橢圓。先畫「有描邊」的一層，再畫「無描邊」的蓋在上面，就只剩外輪廓 -->
    <g id="cloud-path">
      <g class="cloud-outline">
        <circle cx="70"  cy="115" r="48"/>
        <circle cx="120" cy="70"  r="52"/>
        <circle cx="195" cy="55"  r="50"/>
        <circle cx="270" cy="68"  r="52"/>
        <circle cx="330" cy="110" r="50"/>
        <circle cx="305" cy="160" r="45"/>
        <circle cx="235" cy="175" r="40"/>
        <circle cx="160" cy="172" r="42"/>
        <circle cx="95"  cy="158" r="42"/>
        <ellipse cx="200" cy="115" rx="150" ry="66"/>
      </g>
      <g class="cloud-fill">
        <circle cx="70"  cy="115" r="48"/>
        <circle cx="120" cy="70"  r="52"/>
        <circle cx="195" cy="55"  r="50"/>
        <circle cx="270" cy="68"  r="52"/>
        <circle cx="330" cy="110" r="50"/>
        <circle cx="305" cy="160" r="45"/>
        <circle cx="235" cy="175" r="40"/>
        <circle cx="160" cy="172" r="42"/>
        <circle cx="95"  cy="158" r="42"/>
        <ellipse cx="200" cy="115" rx="150" ry="66"/>
      </g>
    </g>
  </defs>
</svg>

<main class="track" id="track">
  <div class="pin" id="pin">
<header class="hero" id="hero">

  <!-- ===== 背景分層：遠(色塊) → 中(虛線圓/星星) → 近(紙張波浪) ===== -->
  <div class="bg" aria-hidden="true">
    <i class="bg-blob b1"></i><i class="bg-blob b2"></i><i class="bg-blob b3"></i>
    <svg class="bg-rings" viewBox="0 0 1000 1000" fill="none" stroke="#6b3a2e" stroke-linecap="round">
      <circle cx="500" cy="500" r="470" stroke-width="3" stroke-dasharray="2 22" stroke-opacity=".28"/>
      <circle cx="500" cy="500" r="360" stroke-width="2.4" stroke-opacity=".12"/>
    </svg>
    <i class="bg-star s1"></i><i class="bg-star s2"></i><i class="bg-star s3"></i>
    <svg class="bg-wave w1" viewBox="0 0 1440 220" preserveAspectRatio="none"><path d="M0 90C180 30 330 30 520 80S900 150 1100 90 1360 30 1440 60V220H0Z"/></svg>
    <svg class="bg-wave w2" viewBox="0 0 1440 220" preserveAspectRatio="none"><path d="M0 120C200 70 380 60 560 110S940 170 1140 120 1380 80 1440 100V220H0Z"/></svg>
  </div>

  <!-- ===== 背景小精靈（布丁 & 藍莓）：由 ghosts.js 產生，夾在背景與場景之間 ===== -->
  <div class="ghost-layer" id="ghostLayer" aria-hidden="true"></div>

  <!-- ===== 導覽列 ===== -->
  <nav class="nav">
    <a class="logo" href="#" aria-label="PickMe 首頁"><img src="images/pickme-logo.png" alt="PickMe!" draggable="false"></a>
    <div class="nav-right">
      <button class="topic-button" id="topicButton" type="button">主題區</button>
      <button class="fav" id="favButton" type="button" aria-label="我的收藏" aria-expanded="false" aria-controls="favPanel">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="m24 5 5.8 12 13.2 1.9-9.5 9.2 2.2 13L24 35l-11.7 6.1 2.2-13L5 18.9 18.2 17 24 5Z"/>
        </svg>
        <span>Favorite</span>
        <b id="favCount" hidden>0</b>
      </button>
      <a class="login" id="loginLink" href="login.html" aria-label="登入">
        <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="7" r="3.5"/>
          <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
        </svg>
        <span>login</span>
      </a>
    </div>
  </nav>

  <!-- ===== 左側場景：女孩 + 雲朵對話框（用 880×800 的設計座標，JS 會整體縮放） ===== -->
  <div class="scene" id="scene">

    <!-- 背景裝飾小星星 -->
    <div class="deco" aria-hidden="true">
      <i class="spark" style="left:120px;top:90px;--s:22px;--d:.2s"></i>
      <i class="spark" style="left:640px;top:120px;--s:16px;--d:1.1s"></i>
      <i class="spark" style="left:760px;top:430px;--s:26px;--d:.7s"></i>
      <i class="spark" style="left:60px;top:470px;--s:14px;--d:1.6s"></i>
      <i class="spark" style="left:520px;top:60px;--s:12px;--d:.4s"></i>
      <i class="spark" style="left:830px;top:300px;--s:14px;--d:1.9s"></i>
    </div>

    <img class="girl" id="girl" src="images/girl.png" alt="正在煩惱的女孩" draggable="false">

    <!-- 思考泡泡（小圓圈），由 JS 依雲朵位置自動算位置 -->
    <div class="dots" id="dots" aria-hidden="true"></div>

    <!-- 1 頂部：要穿什麼 -->
    <div class="cloud" tabindex="0" role="link" data-topic="decide" data-category="outfit" style="--x:220px;--y:135px;--w:330px;--h:150px;--i:0;--fd:5.2s;--depth:.9">
      <img class="ico ico-shake" src="images/icon-stress.svg" alt="" style="--l:200px;--t:-84px;--s:104px">
      <svg class="cloud-shape" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><use href="#cloud-path"/></svg>
      <p class="cloud-text">好難決定啊！<br>出門穿什麼？</p>
    </div>

    <!-- 2 左上：假日去哪 -->
    <div class="cloud" tabindex="0" role="link" data-topic="travel" data-category="travel" style="--x:15px;--y:270px;--w:270px;--h:150px;--i:1;--fd:4.6s;--depth:1.2">
      <img class="ico ico-hop" src="images/icon-travel.svg" alt="" style="--l:28px;--t:-86px;--s:100px">
      <svg class="cloud-shape" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><use href="#cloud-path"/></svg>
      <p class="cloud-text">假日要去<br>哪裡玩？</p>
    </div>

    <!-- 3 右上：三餐吃什麼 -->
    <div class="cloud" tabindex="0" role="link" data-topic="food" data-category="food" style="--x:535px;--y:260px;--w:250px;--h:150px;--i:2;--fd:5.8s;--depth:1.1">
      <img class="ico ico-bounce" src="images/food-bowl.svg"  alt="" style="--l:36px;--t:-70px;--s:80px;--d:0s">
      <img class="ico ico-bounce" src="images/food-sushi.svg" alt="" style="--l:108px;--t:-54px;--s:74px;--d:.12s">
      <img class="ico ico-bounce" src="images/food-bao.svg"   alt="" style="--l:174px;--t:-40px;--s:68px;--d:.24s">
      <svg class="cloud-shape" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><use href="#cloud-path"/></svg>
      <p class="cloud-text">今天三餐<br>吃什麼？</p>
    </div>

    <!-- 4 左下：畫畫沒靈感 -->
    <div class="cloud" tabindex="0" role="link" data-topic="paint" data-category="draw" style="--x:5px;--y:535px;--w:245px;--h:145px;--i:3;--fd:5s;--depth:1.3">
      <img class="ico ico-wiggle" src="images/paint-palette.svg" alt="" style="--l:6px;--t:-58px;--s:84px">
      <img class="ico ico-swing ico-brush" src="images/paint-brush.svg" alt="" style="--l:86px;--t:-80px;--s:46px">
      <svg class="cloud-shape" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><use href="#cloud-path"/></svg>
      <p class="cloud-text">畫畫沒<br>靈感…</p>
    </div>

    <!-- 5 右下：社牛大挑戰 -->
    <div class="cloud" tabindex="0" role="link" data-topic="social" data-category="challenge" style="--x:560px;--y:540px;--w:280px;--h:140px;--i:4;--fd:4.8s;--depth:1.0">
      <img class="ico ico-note"  src="images/dance-note1.svg" alt="" style="--l:136px;--t:-62px;--s:28px;--d:0s">
      <img class="ico ico-dance" src="images/dance-person.svg" alt="" style="--l:178px;--t:-92px;--s:88px">
      <img class="ico ico-note"  src="images/dance-note2.svg" alt="" style="--l:262px;--t:-52px;--s:34px;--d:.35s">
      <svg class="cloud-shape" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><use href="#cloud-path"/></svg>
      <p class="cloud-text">社牛大<br>挑戰？！</p>
    </div>

    <!-- 會沿半圓弧移動的問號 -->
    <img class="qmark" id="qmark" src="images/question.png" alt="" draggable="false">
  </div>

  <p class="sr-only" id="toolLive" aria-live="polite"></p>
</header>

  <aside class="fav-panel" id="favPanel" hidden aria-label="我的收藏清單"></aside>

  <!-- ===== 右側：可轉動的工具輪盤 ===== -->
  <div class="wheel" id="wheel" role="group" aria-label="工具選擇輪盤">
    <svg class="ring" id="ring" aria-hidden="true">
      <circle id="ringDash" fill="none" stroke="#2b2b2b" stroke-opacity=".35" stroke-linecap="round"/>
      <circle id="ringMain" fill="none" stroke="#2b2b2b" stroke-linecap="round"/>
    </svg>
    <div class="wheel-hit" id="wheelHit"></div>
    <div class="nodes" id="nodes"></div>
  </div>

  <section class="tools" id="tools" aria-label="工具介紹"></section>
  <footer class="footer-page" id="footerPage" aria-label="PickMe 網站資訊" aria-hidden="true">
    <svg class="footer-wave-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="footerWaveClip" clipPathUnits="objectBoundingBox">
          <path d="M1 0H.02C.05 .05 .05 .09 .02 .14S-.005 .23 .02 .28 .05 .37 .02 .42-.005 .51 .02 .56 .05 .65 .02 .70-.005 .79 .02 .84 .05 .93 .02 .98C.01 .99 .015 1 .02 1H1Z"/>
        </clipPath>
      </defs>
    </svg>
    <div class="footer-panel">
      <img class="footer-logo" src="images/pickme-logo.png" alt="PickMe!" draggable="false">
      <p class="footer-kicker">PICK YOUR CHOICE</p>
      <h2>選擇不再難，下一步就出發！</h2>
      <p class="footer-copy">挑一種喜歡的方式，讓 PickMe 陪你決定今天的小事。</p>
      <nav class="footer-tools" aria-label="前往工具">
        <a href="tool.html?tool=gacha">扭蛋機</a>
        <a href="tool.html?tool=slot">拉霸機</a>
        <a href="tool.html?tool=claw">娃娃機</a>
        <a href="tool.html?tool=wheel">轉盤</a>
        <a href="tool.html?tool=card">抽卡機</a>
      </nav>
      <button class="footer-home" id="footerHome" type="button">回到首頁</button>
    </div>
    <span class="footer-deco footer-deco-star" aria-hidden="true">✦</span>
    <span class="footer-deco footer-deco-flower" aria-hidden="true">✿</span>
    <span class="footer-deco footer-deco-spark" aria-hidden="true">✧</span>
  </footer>
  <button class="top-ghost" id="footerTop" type="button" aria-label="回到頁首" title="回到頁首" aria-hidden="true" tabindex="-1">
    <span class="top-ghost-sprite" aria-hidden="true">
      <img src="images/ghost-y.png" alt="" draggable="false">
      <span class="top-ghost-eye eye-left"><i class="top-ghost-pupil"></i><i class="top-ghost-lid"></i></span>
      <span class="top-ghost-eye eye-right"><i class="top-ghost-pupil"></i><i class="top-ghost-lid"></i></span>
    </span>
    <span>TOP</span>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="auth.js"></script>
<script src="cursor.js"></script>
<script src="script.js"></script>
<script src="ghosts.js"></script>
</body>
</html>
