<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>
<title>風格幸運娃娃機</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 10px;
    min-height: 100vh;
    background: #fff0f4;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "Microsoft JhengHei", sans-serif;
    user-select: none;
}

#game-machine {
    width: 100%;
    max-width: 470px;
    background: white;
    border: 4px solid #ffccd5;
    border-radius: 24px;
    padding: 18px 14px;
    box-shadow: 0 12px 28px rgba(255,182,193,.4);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.canvas-container {
    width: 100%;
    border: 5px solid #ffccd5;
    border-radius: 16px;
    overflow: hidden;
    background: #fff0f3;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

.result {
    width: 100%;
    min-height: 58px;
    margin-top: 12px;
    padding: 12px 8px;
    border-radius: 12px;
    background: #fff0f5;
    color: #d94e79;
    font-weight: bold;
    font-size: 16px;
    line-height: 1.6;
    white-space: pre-line;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.control-panel {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 15px;
    width: 100%;
    margin-top: 15px;
}

.joystick {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle, #ffe7ef, #f3b3cc);
    border: 4px solid #ffb5cb;
    box-shadow: inset 0 3px 9px #c77c9c55;
    touch-action: none;
    cursor: grab;
}

.stick {
    position: absolute;
    width: 42px;
    height: 42px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: linear-gradient(145deg, white, #e9a3c1);
    border: 2px solid #d77fa5;
    box-shadow: 0 3px 6px #a75b7c66;
    pointer-events: none;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn {
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
}

.btn:active {
    transform: scale(.95);
}

.btn-drop {
    background: #ff4d6d;
}

.btn-reset {
    background: #b99bd8;
}
</style>
</head>

<body>

<div id="game-machine">
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="520"></canvas>
    </div>
    <div class="result" id="result">抓娃娃來決定穿什麼吧！</div>
    <div class="control-panel">
        <div class="joystick-area">
            <div class="joystick" id="joystick">
                <div class="stick" id="stick"></div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn btn-drop" id="btnDrop">🔴 下爪抓取</button>
            <button class="btn btn-reset" id="btnReset">重新開始</button>
        </div>
    </div>
</div>
<script>
window.addEventListener("DOMContentLoaded", () => {

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const resultBox = document.getElementById("result");
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");

    // =====================================
    // 一、隱藏組合
    // =====================================

    const fashionStyles = [
        "韓系", "日系", "臺系", "泰系", "美式",
        "港風", "英倫風", "哥德風", "老錢風", "新中式"
    ];

    const colors = [
        "紅色", "橙色", "黃色", "綠色", "藍色",
        "紫色", "棕色", "黑色", "白色", "銀色"
    ];

    const luckyItems = [
        "蝴蝶結", "星星", "愛心", "羽毛", "幸運草",
        "音符", "花朵", "天使翅膀", "十字架", "皇冠"
    ];

    const TOY_COUNT = 45;

    const PLAY_AREA = {
        minX: 90,
        maxX: 385,
        minY: 245,
        maxY: 500
    };

    // =====================================
    // 二、遊戲狀態
    // =====================================

    const STATE_IDLE = "IDLE";
    const STATE_DROPPING = "DROPPING";
    const STATE_GRABBING = "GRABBING";
    const STATE_RISING = "RISING";
    const STATE_RETURNING = "RETURNING";
    const STATE_DELIVERING = "DELIVERING";

    let gameState = STATE_IDLE;

    let score = 0;
    let toys = [];
    let heldToy = null;
    let keys = {};

    let combinationDeck = [];
    let combinationIndex = 0;

    let joystickX = 0;
    let joystickY = 0;
    let joystickActive = false;

    const claw = {
        x: 220,
        y: 220,
        dropOffset: 0,
        maxDrop: 110,
        speedX: 4,
        speedY: 3
    };

    // =====================================
    // 三、組合隨機排序
    // =====================================

    function shuffle(array) {

        const arr = [...array];

        for (let i = arr.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [arr[i], arr[j]] = [arr[j], arr[i]];
        }

        return arr;
    }

    function createCombinationDeck() {

        const allCombinations = [];

        for (const style of fashionStyles) {
            for (const color of colors) {
                for (const luckyItem of luckyItems) {

                    allCombinations.push({
                        style,
                        color,
                        luckyItem
                    });
                }
            }
        }

        combinationDeck = shuffle(allCombinations);
        combinationIndex = 0;
    }

    function getNextCombination() {

        if (combinationIndex >= combinationDeck.length) {
            return null;
        }

        return combinationDeck[combinationIndex++];
    }

    // =====================================
    // 四、服裝外觀設定
    // 不使用翅膀、角、尾巴或人物五官
    // =====================================

    const outfitStyles = [

        {
            main: "#f5dce5",
            shade: "#d9aebe",
            detail: "#b97898",
            collar: "#fff8fa",
            bottom: "#e9b9ce"
        },

        {
            main: "#e5e1f4",
            shade: "#b9afd6",
            detail: "#9584bd",
            collar: "#f8f5ff",
            bottom: "#c9c0e3"
        },

        {
            main: "#dcece7",
            shade: "#a7c9bc",
            detail: "#759d8e",
            collar: "#f7fffb",
            bottom: "#b9d8cc"
        },

        {
            main: "#f4e6d4",
            shade: "#d4b99c",
            detail: "#a98a6c",
            collar: "#fffaf1",
            bottom: "#e5cfb3"
        },

        {
            main: "#343344",
            shade: "#1f1e2d",
            detail: "#a98ba9",
            collar: "#f0e9f1",
            bottom: "#51485d"
        },

        {
            main: "#d9dce9",
            shade: "#a9b0c9",
            detail: "#7b86aa",
            collar: "#f8f8ff",
            bottom: "#bbc3da"
        },

        {
            main: "#e7c5bd",
            shade: "#c99b91",
            detail: "#a96e71",
            collar: "#fff4ed",
            bottom: "#dcb1a7"
        },

        {
            main: "#c7b5a7",
            shade: "#9c887a",
            detail: "#75675e",
            collar: "#f5eee8",
            bottom: "#b5a294"
        }
    ];

    // =====================================
    // 五、服裝娃娃
    // =====================================

    class Toy {

        constructor(x, y, combination) {

            this.x = x;
            this.y = y;
            this.radius = 15;

            // 隱藏組合
            this.combination = combination;

            // 外觀獨立隨機
            this.visualStyle =
                outfitStyles[
                    Math.floor(Math.random() * outfitStyles.length)
                ];

            this.outfitType = Math.floor(Math.random() * 7);

            this.patternType = Math.floor(Math.random() * 5);
        }

        draw() {

            const s = this.visualStyle;

            ctx.save();
            ctx.translate(this.x, this.y);

            // 地面陰影
            ctx.fillStyle = "rgba(91,65,92,0.13)";

            ctx.beginPath();
            ctx.ellipse(0, 17, 14, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // 衣服輪廓
            ctx.fillStyle = s.main;
            ctx.strokeStyle = s.shade;
            ctx.lineWidth = 1.4;

            // 袖子
            ctx.beginPath();

            ctx.moveTo(-7, -9);
            ctx.lineTo(-16, -3);
            ctx.lineTo(-13, 8);
            ctx.lineTo(-7, 5);
            ctx.closePath();

            ctx.moveTo(7, -9);
            ctx.lineTo(16, -3);
            ctx.lineTo(13, 8);
            ctx.lineTo(7, 5);
            ctx.closePath();

            ctx.fill();
            ctx.stroke();

            // 主體：不同服裝版型
            ctx.beginPath();

            switch (this.outfitType) {

                case 0:
                    // 一般上衣
                    ctx.moveTo(-7, -13);
                    ctx.lineTo(7, -13);
                    ctx.lineTo(10, -5);
                    ctx.lineTo(11, 13);
                    ctx.lineTo(-11, 13);
                    ctx.lineTo(-10, -5);
                    break;

                case 1:
                    // 連帽上衣
                    ctx.moveTo(-8, -13);
                    ctx.quadraticCurveTo(-12, -18, -5, -17);
                    ctx.quadraticCurveTo(0, -20, 5, -17);
                    ctx.quadraticCurveTo(12, -18, 8, -13);
                    ctx.lineTo(12, 14);
                    ctx.lineTo(-12, 14);
                    break;

                case 2:
                    // 針織衫
                    ctx.moveTo(-8, -13);
                    ctx.lineTo(8, -13);
                    ctx.lineTo(11, -5);
                    ctx.lineTo(10, 14);
                    ctx.lineTo(-10, 14);
                    ctx.lineTo(-11, -5);
                    break;

                case 3:
                    // 西裝外套
                    ctx.moveTo(-8, -13);
                    ctx.lineTo(8, -13);
                    ctx.lineTo(12, -5);
                    ctx.lineTo(11, 14);
                    ctx.lineTo(-11, 14);
                    ctx.lineTo(-12, -5);
                    break;

                case 4:
                    // 襯衫
                    ctx.moveTo(-8, -13);
                    ctx.lineTo(8, -13);
                    ctx.lineTo(10, -5);
                    ctx.lineTo(10, 14);
                    ctx.lineTo(-10, 14);
                    ctx.lineTo(-10, -5);
                    break;

                case 5:
                    // 洋裝
                    ctx.moveTo(-7, -13);
                    ctx.lineTo(7, -13);
                    ctx.lineTo(10, -5);
                    ctx.lineTo(15, 15);
                    ctx.lineTo(-15, 15);
                    ctx.lineTo(-10, -5);
                    break;

                case 6:
                    // 寬鬆外套
                    ctx.moveTo(-8, -13);
                    ctx.lineTo(8, -13);
                    ctx.lineTo(13, -5);
                    ctx.lineTo(14, 14);
                    ctx.lineTo(-14, 14);
                    ctx.lineTo(-13, -5);
                    break;
            }

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 領口
            ctx.strokeStyle = s.collar;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(-6, -12);
            ctx.lineTo(0, -5);
            ctx.lineTo(6, -12);
            ctx.stroke();

            // 衣服中線
            ctx.strokeStyle = s.shade;
            ctx.lineWidth = 0.8;

            ctx.beginPath();
            ctx.moveTo(0, -4);
            ctx.lineTo(0, 13);
            ctx.stroke();

            // 下擺
            ctx.fillStyle = s.bottom;

            ctx.fillRect(-10, 10, 20, 3);

            // 服裝細節
            ctx.fillStyle = s.detail;
            ctx.strokeStyle = s.detail;

            switch (this.patternType) {

                case 0:
                    // 蝴蝶結
                    ctx.beginPath();
                    ctx.moveTo(0, -5);
                    ctx.lineTo(-5, -9);
                    ctx.lineTo(-5, -2);
                    ctx.closePath();

                    ctx.moveTo(0, -5);
                    ctx.lineTo(5, -9);
                    ctx.lineTo(5, -2);
                    ctx.closePath();

                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(0, -5, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 1:
                    // 口袋
                    ctx.strokeRect(-7, 0, 5, 6);
                    ctx.strokeRect(2, 0, 5, 6);
                    break;

                case 2:
                    // 排扣
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(0, -1 + i * 4, 0.9, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;

                case 3:
                    // 條紋
                    ctx.lineWidth = 1;

                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(-8, i * 4);
                        ctx.lineTo(8, i * 4);
                        ctx.stroke();
                    }
                    break;

                case 4:
                    // 胸前小標籤
                    ctx.strokeRect(3, -7, 4, 4);

                    ctx.beginPath();
                    ctx.arc(5, -5, 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    break;
            }

            // 袖口
            ctx.strokeStyle = s.detail;
            ctx.lineWidth = 1.2;

            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.lineTo(-10, 5);

            ctx.moveTo(10, 5);
            ctx.lineTo(15, 5);

            ctx.stroke();

            // 裙裝下擺裝飾
            if (this.outfitType === 5) {

                ctx.strokeStyle = s.detail;
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(-13, 12);
                ctx.quadraticCurveTo(-7, 9, 0, 12);
                ctx.quadraticCurveTo(7, 9, 13, 12);
                ctx.stroke();
            }

            // 帽T口袋
            if (this.outfitType === 1) {

                ctx.strokeStyle = s.shade;
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(-6, 5);
                ctx.lineTo(-4, 9);
                ctx.lineTo(4, 9);
                ctx.lineTo(6, 5);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    // =====================================
    // 六、隨機生成娃娃位置
    // =====================================

    function generateToyPositions(count, existing = []) {

        const positions = [];

        let minDistance = 27;
        let attempts = 0;

        while (positions.length < count && attempts < 30000) {

            attempts++;

            const candidate = {
                x: PLAY_AREA.minX +
                    Math.random() * (PLAY_AREA.maxX - PLAY_AREA.minX),

                y: PLAY_AREA.minY +
                    Math.random() * (PLAY_AREA.maxY - PLAY_AREA.minY)
            };

            const occupied = [...existing, ...positions];

            if (occupied.every(point =>
                Math.hypot(
                    point.x - candidate.x,
                    point.y - candidate.y
                ) >= minDistance
            )) {
                positions.push(candidate);
            }

            if (attempts % 5000 === 0) {
                minDistance = Math.max(22, minDistance - 1);
            }
        }

        return positions;
    }

    // =====================================
    // 七、建立娃娃
    // =====================================

    function createToys() {

        toys = [];

        createCombinationDeck();

        const positions = generateToyPositions(TOY_COUNT);

        for (const position of positions) {

            toys.push(
                new Toy(position.x, position.y, getNextCombination())
            );
        }
    }

    function refillOneToy() {

        if (toys.length >= TOY_COUNT) return;
        if (combinationIndex >= combinationDeck.length) return;

        const [position] = generateToyPositions(1, toys);

        if (!position) return;

        const combination = getNextCombination();

        if (combination) {
            toys.push(new Toy(position.x, position.y, combination));
        }
    }

    // =====================================
    // 八、尋找夾爪附近的娃娃
    // =====================================

    function findNearestToy() {

        let nearest = null;
        let minDistance = Infinity;

        const targetX = claw.x;
        const targetY = claw.y + claw.dropOffset;

        for (const toy of toys) {

            const distance = Math.hypot(
                targetX - toy.x,
                targetY - toy.y
            );

            if (distance < minDistance) {
                minDistance = distance;
                nearest = toy;
            }
        }

        return nearest && minDistance <= 45 ? nearest : null;
    }

    // =====================================
    // 九、開始抓取
    // =====================================

    function startGrab() {

        if (gameState !== STATE_IDLE) return;

        if (toys.length === 0) {

            resultBox.textContent =
                "本輪 1,000 種組合已全部使用！請重新開始。";

            return;
        }

        gameState = STATE_DROPPING;

        resultBox.textContent = "夾爪正在下降……";
    }

    // =====================================
    // 十、搖桿
    // =====================================

    function updateJoystick(event) {

        const rect = joystick.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = event.clientX - centerX;
        let dy = event.clientY - centerY;

        const maxDistance = 34;
        const distance = Math.hypot(dx, dy);

        if (distance > maxDistance) {
            dx = dx / distance * maxDistance;
            dy = dy / distance * maxDistance;
        }

        joystickX = dx / maxDistance;
        joystickY = dy / maxDistance;

        stick.style.left = `calc(50% + ${dx}px)`;
        stick.style.top = `calc(50% + ${dy}px)`;
    }

    function resetJoystick() {

        joystickX = 0;
        joystickY = 0;
        joystickActive = false;

        stick.style.left = "50%";
        stick.style.top = "50%";
    }

    joystick.addEventListener("pointerdown", event => {

        joystickActive = true;
        joystick.setPointerCapture(event.pointerId);

        updateJoystick(event);
    });

    joystick.addEventListener("pointermove", event => {

        if (joystickActive) {
            updateJoystick(event);
        }
    });

    joystick.addEventListener("pointerup", resetJoystick);
    joystick.addEventListener("pointercancel", resetJoystick);
    joystick.addEventListener("lostpointercapture", resetJoystick);

    // =====================================
    // 十一、鍵盤操作
    // =====================================

    window.addEventListener("keydown", event => {

        keys[event.code] = true;

        if (event.code === "Space") {
            event.preventDefault();

            if (!event.repeat) {
                startGrab();
            }
        }
    });

    window.addEventListener("keyup", event => {
        keys[event.code] = false;
    });

    // =====================================
    // 十二、移動夾爪
    // =====================================

    function moveClaw() {

        if (gameState !== STATE_IDLE) return;

        let dx = joystickX;
        let dy = joystickY;

        if (keys["ArrowLeft"]) dx -= 1;
        if (keys["ArrowRight"]) dx += 1;
        if (keys["ArrowUp"]) dy -= 1;
        if (keys["ArrowDown"]) dy += 1;

        const length = Math.hypot(dx, dy);

        if (length > 1) {
            dx /= length;
            dy /= length;
        }

        claw.x += dx * claw.speedX;
        claw.y += dy * claw.speedY;

        claw.x = Math.max(85, Math.min(380, claw.x));
        claw.y = Math.max(190, Math.min(350, claw.y));
    }

    // =====================================
    // 十三、遊戲更新
    // =====================================

    function update() {

        moveClaw();

        switch (gameState) {

            case STATE_IDLE:
                break;

            case STATE_DROPPING:

                claw.dropOffset += 5;

                if (claw.dropOffset >= claw.maxDrop) {

                    claw.dropOffset = claw.maxDrop;
                    gameState = STATE_GRABBING;
                }

                break;

            case STATE_GRABBING:

                heldToy = findNearestToy();

                if (heldToy) {
                    heldToy.x = claw.x;
                    heldToy.y = claw.y + claw.dropOffset + 20;
                }

                gameState = STATE_RISING;
                break;

            case STATE_RISING:

                claw.dropOffset -= 5;

                if (heldToy) {
                    heldToy.x = claw.x;
                    heldToy.y = claw.y + claw.dropOffset + 20;
                }

                if (claw.dropOffset <= 0) {

                    claw.dropOffset = 0;
                    gameState = STATE_RETURNING;

                    resultBox.textContent = heldToy
                        ? "抓到了！正在送往出貨口……"
                        : "沒有抓到娃娃，請再試一次！";
                }

                break;

            case STATE_RETURNING:

                claw.x = Math.max(45, claw.x - 4);

                if (claw.y < 390) {
                    claw.y = Math.min(390, claw.y + 3);
                } else if (claw.y > 390) {
                    claw.y = Math.max(390, claw.y - 3);
                }

                if (heldToy) {
                    heldToy.x = claw.x;
                    heldToy.y = claw.y + 22;
                }

                if (claw.x === 45 && claw.y === 390) {

                    if (heldToy) {
                        gameState = STATE_DELIVERING;
                        resultBox.textContent = "娃娃正在掉進出貨口！";
                    } else {
                        gameState = STATE_IDLE;
                        claw.y = 220;
                        resultBox.textContent = "沒有抓到娃娃，請再試一次！";
                    }
                }

                break;

            case STATE_DELIVERING:

                if (heldToy) {

                    heldToy.x = 45;
                    heldToy.y += 7;

                    if (heldToy.y >= 490) {

                        const selectedCombination = heldToy.combination;

                        toys = toys.filter(toy => toy !== heldToy);

                        heldToy = null;

                        score++;

                        refillOneToy();

                        resultBox.textContent =
                            `${selectedCombination.style}+${selectedCombination.color}+${selectedCombination.luckyItem}`;

                        if (
                            combinationIndex >= combinationDeck.length &&
                            toys.length === 0
                        ) {
                            resultBox.textContent +=
                                "\n\n本輪 1,000 種組合已全部使用！";
                        }

                        claw.x = 220;
                        claw.y = 220;
                        claw.dropOffset = 0;

                        gameState = STATE_IDLE;
                    }
                }

                break;
        }
    }

    // =====================================
    // 十四、背景
    // =====================================

    function drawBackground() {

        ctx.fillStyle = "#fff0f3";
        ctx.fillRect(0, 0, 400, 520);

        // 橫桿
        ctx.strokeStyle = "#ff6b8b";
        ctx.lineWidth = 5;

        ctx.beginPath();
        ctx.moveTo(30, 60);
        ctx.lineTo(370, 60);
        ctx.stroke();

        // 出貨口
        ctx.fillStyle = "#e0a6b1";
        ctx.fillRect(15, 430, 65, 90);

        ctx.fillStyle = "#2d2d2d";
        ctx.fillRect(20, 440, 55, 80);

        ctx.fillStyle = "rgba(255,182,193,0.6)";
        ctx.fillRect(80, 450, 6, 70);
    }

    // =====================================
    // 十五、夾爪
    // =====================================

    function drawClaw() {

    const tipY = claw.y + claw.dropOffset;

    // 夾爪寬度設定
    const openWidth = 18;   // 張開時半寬
    const closeWidth = 10;  // 閉合時半寬
    const clawThickness = 3.5;

    ctx.strokeStyle = "#888";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(claw.x, 60);
    ctx.lineTo(claw.x, tipY);
    ctx.stroke();

    ctx.fillStyle = "#ff4d6d";

    ctx.beginPath();
    ctx.arc(claw.x, tipY, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff4d6d";
    ctx.lineWidth = clawThickness;
    ctx.lineCap = "round";

    if (gameState === STATE_GRABBING || heldToy) {

        ctx.beginPath();

        ctx.moveTo(claw.x - closeWidth, tipY);
        ctx.lineTo(claw.x - closeWidth * 0.6, tipY + 20);

        ctx.moveTo(claw.x + closeWidth, tipY);
        ctx.lineTo(claw.x + closeWidth * 0.6, tipY + 20);

        ctx.stroke();

    } else {

        ctx.beginPath();

        ctx.moveTo(claw.x, tipY);
        ctx.lineTo(claw.x - openWidth, tipY + 20);

        ctx.moveTo(claw.x, tipY);
        ctx.lineTo(claw.x + openWidth, tipY + 20);

        ctx.stroke();
    }
}

    // =====================================
    // 十六、繪製畫面
    // =====================================

    function draw() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        const sortedToys = [...toys].sort(
            (a, b) => a.y - b.y
        );

        for (const toy of sortedToys) {

            if (toy !== heldToy) {
                toy.draw();
            }
        }

        if (heldToy) {
            heldToy.draw();
        }

        drawClaw();

        ctx.fillStyle = "#ff4d6d";
        ctx.font = "bold 18px 'Microsoft JhengHei'";
        ctx.textAlign = "left";

    }

    // =====================================
    // 十七、主迴圈
    // =====================================

    function gameLoop() {

        update();
        draw();

        requestAnimationFrame(gameLoop);
    }

    // =====================================
    // 十八、按鈕
    // =====================================

    document.getElementById("btnDrop")
        .addEventListener("click", startGrab);

    document.getElementById("btnReset")
        .addEventListener("click", () => {

            score = 0;

            heldToy = null;

            claw.x = 220;
            claw.y = 220;
            claw.dropOffset = 0;

            gameState = STATE_IDLE;

            resultBox.textContent =
                "重新開始！抓一隻娃娃吧！";

            resetJoystick();

            createToys();
        });

    // =====================================
    // 十九、啟動
    // =====================================

    createToys();
    gameLoop();

});
</script>
